name: Build Lyra Player APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android SDK sdkmanager tidak ditemukan pada runner."
            find "$ANDROID_HOME" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi
          echo "SDK Manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Gradle 8.9
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            --output /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Locate Android project
        shell: bash
        run: |
          SETTINGS_FILE="$(find . -type f -name settings.gradle.kts \
            -not -path '*/.gradle/*' -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::settings.gradle.kts tidak ditemukan."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project ditemukan di: $PROJECT_DIR"

      - name: Build debug APK
        shell: bash
        run: |
          gradle --no-daemon -p "$PROJECT_DIR" assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LyraPlayer-debug-apk
          path: '**/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 7
